name: Publish

on:
  push:
    branches: [main]

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    if: "!startsWith(github.event.head_commit.message, 'chore: release')"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # termrender is a runtime dep of parseDeck (src/shared/ask-schema.ts) and
      # is invoked by the ask-schema unit tests run via prepublishOnly.
      - uses: astral-sh/setup-uv@v3

      - name: Install termrender
        run: |
          uv tool install termrender
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # OIDC trusted publishing requires npm >= 11.5.1; Node 22 ships with 10.x.
      # Pin a specific version (not @latest) to avoid the arborist promise-retry
      # corruption that motivated 99b8371's removal of the upgrade step.
      - name: Upgrade npm for OIDC trusted publishing
        run: npm install -g npm@11.5.2

      - name: Bump version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          npm version patch -m "chore: release v%s"
          git push --follow-tags

      - run: npm publish --provenance
        env:
          npm_config_registry: https://registry.npmjs.org
